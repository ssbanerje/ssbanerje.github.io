# Basic Stuff
title = "Subho Sankar Banerjee"
baseURL = "https://ssbanerje.github.io"
locale = "en-us"
enableRobotsTXT = true
enableGitInfo = true
enableInlineShortcodes = true
disableKinds = ["term", "taxonomy"]
buildFuture = true

[outputs]
  home = ["html", "rss"]
  section = ["html"]

[services]
  [services.googleAnalytics]
    id = "G-VGWDWM7F6S"
  [services.rss]
    limit = 15

# Markdown & Rendering
[markup]
  [markup.highlight]
    style = "manni"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = true

# Site parameters
[params]
  showFeatured = true
  description = "Subho Sankar Banerjee — Software Engineer at Google DeepMind working on post-training Gemini, AI systems and infrastructure, and reinforcement learning."
  images = ["img/me_sq.webp"]

# Hugo Modules
[module]
  [[module.imports]]
    path = "github.com/jgthms/bulma"
    [[module.imports.mounts]]
      source = "sass"
      target = "assets/scss/bulma/sass"
