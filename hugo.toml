# Basic Stuff
title = "Subho Sankar Banerjee"
baseURL = "https://ssbanerje.github.io"
locale = "en-us"
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["term", "taxonomy"]
buildFuture = true

[services]
  [services.googleAnalytics]
    id = "G-VGWDWM7F6S"
  [services.rss]
    limit = 15

# Markdown & Rendering
[markup]
  [markup.highlight]
    style = "manni"

# Site parameters
[params]
  showFeatured = true
  description = "Subho Sankar Banerjee — Software Engineer at Google DeepMind researching systems, computer architecture, and machine learning."
  images = ["img/me_sq.webp"]

# SEO Stuff
[sitemap]
  changefreq = "weekly"
  priority = 0.5

# Hugo Modules
[module]
  [[module.imports]]
    path = "github.com/jgthms/bulma"
    [[module.imports.mounts]]
      source = "sass"
      target = "assets/scss/bulma/sass"
