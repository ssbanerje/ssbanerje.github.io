{{ define "main" }}
  <section class="section">
    <div class="content">
      {{ .Content }}
    </div>
  </section>

  <section class="section">
    <h1 class="title is-1">
      News
      <span class="subtitle is-4">[<a href="/news/">More Entries</a>]</span>
    </h1>
    {{ partial "news_list.html" (dict "page" . "items" (first 5 hugo.Data.news.news)) }}
  </section>

  <section class="section has-text-left">
    <h1 class="title is-1">
      Selected Publications&nbsp;
      <span class="subtitle is-4">[Full List: <a href="/publications/">Publications</a>, <a href="/projects/">Projects</a>]</span>
    </h1>
    {{ partial "publications_bydate.html" . }}
  </section>
{{ end }}
