<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en-us" }}">

{{ partial "header.html" . }}

<body>
  <a class="visually-hidden skip-link" href="#content">Skip to main content</a>
  <div class="columns is-gapless m-0">
    <aside class="column is-one-quarter-tablet is-narrow-desktop" id="sidebar">
      {{ partialCached "sidebar.html" . .IsHome }}
    </aside>

    <div class="column">
      <main id="content" class="has-text-justified">
        {{ if (and (not .IsHome) (ne .Kind "404")) }}
          <section class="section">
            {{ partial "breadcrumbs.html" . }}
          </section>
        {{ end }}
        {{ block "main" . }}
          <!-- Main Block content -->
        {{ end }}
      </main>
      {{ partialCached "footer.html" . }}
    </div>

    <div class="column is-1 is-hidden-touch" id="right"></div>
  </div>

  {{ partialCached "js_footer.html" . }}
</body>

</html>
