<footer class="footer">
  <div class="content has-text-dark">
    <ul role="list">
      <li><span class="icon has-text-info"><i class="fa-solid fa-heading fa-fw" aria-hidden="true"></i></span> Powered by <a href="https://www.gohugo.io">Hugo</a></li>
      <li><span class="icon has-text-link"><i class="fa-solid fa-pencil fa-fw" aria-hidden="true"></i></span> Last updated {{ site.Lastmod.Format "01/02/2006" }}</li>
      {{ with site.Home.OutputFormats.Get "rss" }}
      <li><a href="{{ .Permalink }}"><span class="icon has-text-orange"><i class="fa-solid fa-rss fa-fw" aria-hidden="true"></i></span> Feed</a></li>
      {{ end }}
    </ul>
  </div>
</footer>
