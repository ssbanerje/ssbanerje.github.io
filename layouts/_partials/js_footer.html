<script type="speculationrules">
{
  "prefetch": [{
    "where": {
      "and": [
        { "href_matches": "/*" },
        { "not": { "href_matches": "/*.pdf" } },
        { "not": { "href_matches": "/*.bib" } },
        { "not": { "href_matches": "/*.xml" } },
        { "not": { "selector_matches": "[noprefetch], [download], [target=_blank]" } }
      ]
    },
    "eagerness": "moderate"
  }]
}
</script>
