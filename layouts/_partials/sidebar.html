<div class="padded-sidebar">
  <section class="section">
    <figure class="image container">
      {{- $avatar := partialCached "avatar.html" . -}}
      <img class="is-rounded"
           src="{{ $avatar.x1.RelPermalink }}"
           srcset="{{ $avatar.x1.RelPermalink }} 256w, {{ $avatar.x2.RelPermalink }} 468w"
           sizes="(max-width: 768px) 175px, 256px"
           width="256" height="256" fetchpriority="high" alt="{{ hugo.Data.personal.name }}" />
    </figure>
    <div class="sidebar-content has-text-centered">
      {{ if .IsHome }}
        <h1 class="sidebar-title title is-1"><a href="/">{{ hugo.Data.personal.name }}</a></h1>
      {{ else }}
        <div class="sidebar-title title is-1"><a href="/">{{ hugo.Data.personal.name }}</a></div>
      {{ end }}
      <p class="has-text-white-ter">
        {{ hugo.Data.personal.position }} @ {{ hugo.Data.personal.company }}
      </p>
      <ul class="icon-list is-clearfix" role="list">
      {{ range $social := hugo.Data.social.link }}
        <li><a href="{{ $social.link }}" aria-label="{{ $social.label }}"><i class="{{ $social.icon }}" aria-hidden="true"></i></a></li>
      {{ end }}
      </ul>
    </div>
  </section>
</div>
