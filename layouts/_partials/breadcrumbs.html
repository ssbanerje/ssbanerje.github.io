<nav class="breadcrumb" aria-label="breadcrumbs">
  <ul>
    {{ range .Ancestors.Reverse }}
      {{ if .IsHome }}
        <li><a href="/"><span class="icon is-small"><i class="fa-solid fa-house" aria-hidden="true"></i></span><span>Home</span></a></li>
      {{ else }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    {{ end }}
    <li class="is-active"><a href="{{ .RelPermalink }}" aria-current="page">This Page<span class="visually-hidden">: {{ .Title }}</span></a></li>
  </ul>
</nav>
