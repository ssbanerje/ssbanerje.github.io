{{ define "main" }}
  <section class="section">
    <div class="has-text-left">
      <h1 class="title is-1 no-border">{{ .Title }}</h1>
      <h3 class="title is-3 has-text-grey"><i>{{ .Params.institution }}, {{ .Params.period }}</i></h3>
    </div>
    <br><hr>

    <div class="content">
      {{ .Content }}
    </div>
  </section>

  <section class="section has-text-left">
    <h2 class="title is-2">Related Publications</h2>
    {{ partial "publications_bydate.html" . }}
  </section>
{{ end }}
