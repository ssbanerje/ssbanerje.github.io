{{ define "main" }}

    <div>
      <h1 class="title is-1 no-border">{{ .Title }}</h1>
      <div class="title is-3 has-text-grey"><i>{{ .Params.institution }}, {{ .Params.period }}</i></div>
    </div>
    <br><hr>

    <div class="content">
      {{ .Content }}
    </div>
  </section>

  <section class="section">
    <h2 class="title is-2">Related Publications</h2>
    {{ partial "publications_bydate.html" . }}
  </section>
{{ end }}
