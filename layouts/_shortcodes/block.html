<article class="message {{ .Get "class" }}">
  {{ with (.Get "title") }}
  <div class="message-header">
    <span>
      <span class="icon"><i class="fas fa-info-circle"></i></span>&nbsp;{{ $.Page.RenderString . }}
    </span>
  </div>
  {{ end }}
  <div class="message-body">
    {{ .Inner | $.Page.RenderString (dict "display" "block") | emojify }}
  </div>
</article>
