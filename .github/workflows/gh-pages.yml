name: GitHub Pages

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          lfs: false

      - name: Typecheck
        run: make typecheck

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-mods-${{ hashFiles('go.sum') }}

      # Same Hugo image as the Dockerfile; keep the hugo flags in sync with Makefile `public`.
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/hugo_cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HUGO_CACHEDIR=/tmp/hugo_cache \
            -e GOFLAGS=-modcacherw \
            -e TZ=America/Los_Angeles \
            -v "$RUNNER_TEMP/hugo_cache:/tmp/hugo_cache" \
            -v "$GITHUB_WORKSPACE:/project" \
            ghcr.io/gohugoio/hugo:v0.169.0 \
            build --gc --minify --cleanDestinationDir --printPathWarnings

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
