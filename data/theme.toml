# Color scheme
[colors.sidebar]
  background = "#141f33"
  text = "#fff"
  link = "#fff"
  linkhover = "#feb24c"

[colors.content]
  background = "#fff"
  text = "#333"
  link = "#274798"
  linkhover = "#f16421"
  award = "#812717"

# Fonts (Google Fonts); axes = css2 axis spec of the styles/weights in use.
[fonts.sidebar]
  name = "Eczar"
  axes = "wght@700;800"

[fonts.content]
  name = "Lato"
  axes = "ital,wght@0,400;0,700;1,400;1,700"

[fonts.mono]
  name = "Inconsolata"
  axes = "wght@400;700"
